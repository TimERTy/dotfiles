# Hyprlock screen locker

$cache_folder = $HOME/.cache/hypr

source = colors.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path     = $cache_folder/blurred_wallpaper.png
}

input-field {
    monitor            =
    size               = 200, 50
    position           = 0, -20
    halign             = center
    valign             = center
    rounding           = 10
    outline_thickness  = 3
    inner_color        = $primary
    outer_color        = $on_primary
    font_color         = $on_primary
    font_family        = Fira Semibold
    check_color        = $primary
    fail_color         = $error
    fail_text          = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color     = -1
    numlock_color      = -1
    bothlock_color     = -1
    invert_numlock     = false
    swap_font_color    = false
    hide_input         = false
    placeholder_text   = <i>Input Password...</i>
    dots_size          = 0.33
    dots_spacing       = 0.15
    dots_center        = true
    dots_rounding      = -1
    fade_on_empty      = true
    fade_timeout       = 1000
    shadow_passes      = 10
    shadow_size        = 20
    shadow_color       = $shadow
    shadow_boost       = 1.6
}

# Clock
label {
    monitor       =
    text          = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size     = 70
    font_family   = Fira Sans Semibold
    color         = $primary
    position      = -50, 20
    halign        = right
    valign        = bottom
    shadow_passes = 5
    shadow_size   = 10
}

# Username
label {
    monitor       =
    text          = $USER
    font_size     = 20
    font_family   = Fira Sans Semibold
    color         = $primary
    position      = -50, 120
    halign        = right
    valign        = bottom
    shadow_passes = 5
    shadow_size   = 10
}

# Wallpaper thumbnail
image {
    monitor       =
    path          = $cache_folder/square_wallpaper.png
    size          = 280
    rounding      = 40
    border_size   = 4
    border_color  = $primary $on_primary 90deg
    rotate        = 0
    reload_time   = -1
    position      = 0, 200
    halign        = center
    valign        = center
    shadow_passes = 10
    shadow_size   = 20
    shadow_color  = $shadow
    shadow_boost  = 1.6
}
