# Keybindings

$mainMod = SUPER

# ── Applications ──────────────────────────────────────────────────────────────

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, B, exec, env MOZ_VA_INTEL_DISABLE_FORMATS=0 firefox
bind = $mainMod, E, exec, nautilus --new-window
bind = $mainMod, D, exec, rofi -show drun -replace -i
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, F1, exec, ~/.config/hypr/scripts/keybindings.sh

# ── Windows ───────────────────────────────────────────────────────────────────

bind  = $mainMod, Q, killactive
bind  = $mainMod, F, fullscreen, 0
bind  = $mainMod, T, togglefloating
bind  = $mainMod, J, layoutmsg, togglesplit
bind  = $mainMod, K, layoutmsg, swapsplit

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

bind = $mainMod SHIFT, right, resizeactive,  100 0
bind = $mainMod SHIFT, left,  resizeactive, -100 0
bind = $mainMod SHIFT, down,  resizeactive,  0  100
bind = $mainMod SHIFT, up,    resizeactive,  0 -100

bind  = $mainMod ALT, left,  swapwindow, l
bind  = $mainMod ALT, right, swapwindow, r
bind  = $mainMod ALT, up,    swapwindow, u
bind  = $mainMod ALT, down,  swapwindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Workspaces ────────────────────────────────────────────────────────────────

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, Tab,       workspace, m+1
bind = $mainMod SHIFT, Tab, workspace, m-1

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

bind = $mainMod CTRL, down, workspace, empty

# ── Actions ───────────────────────────────────────────────────────────────────

bind = $mainMod CTRL, R,  exec, hyprctl reload
bind = $mainMod CTRL, Q,  exec, wlogout
bind = $mainMod, L,       exec, hyprlock
bind = $mainMod, S,   exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod CTRL, S,   exec, ~/.config/hypr/scripts/screenshot.sh --instant
bind = $mainMod SHIFT, S,   exec, ~/.config/hypr/scripts/screenshot.sh --instant-area
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh

# ── Lid Switch ────────────────────────────────────────────────────────────────

bindl = ,switch:off:Lid Switch,exec,hyprctl dispatch dpms off
bindl = ,switch:on:Lid Switch,exec,hyprctl dispatch dpms on && brightnessctl -r

# ── Media & Function Keys ─────────────────────────────────────────────────────

bind   = , XF86MonBrightnessUp,   exec, brightnessctl -q s +10%
bind   = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-
bindle = , XF86AudioRaiseVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindle = , XF86AudioLowerVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind   = , XF86AudioMute,         exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind   = , XF86AudioMicMute,      exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind   = , XF86AudioPlay,         exec, playerctl play-pause
bind   = , XF86AudioPause,        exec, playerctl pause
bind   = , XF86AudioNext,         exec, playerctl next
bind   = , XF86AudioPrev,         exec, playerctl previous
bind   = , XF86Lock,              exec, hyprlock
bind   = , code:238,              exec, brightnessctl -d :white:kbd_backlight s +10
bind   = , code:237,              exec, brightnessctl -d :white:kbd_backlight s 10-
